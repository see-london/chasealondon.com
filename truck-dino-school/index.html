<meta charset="utf-8">
<title>Truck &amp; Dino School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen toy playmat. Top bar (exit lock, race-track progress, repeat), big spoken prompt, asphalt stage, giant answer buttons. Deliberately single bright look. */
:root{
  --sky:#8fd3ff; --sky2:#c9ecff; --asphalt:#454b59; --lane:#ffd23f;
  --sun:#ffd23f; --ink:#1c2230; --paper:#fffaf0; --go:#2fbf5a; --stop:#ff4d3d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky),var(--sky2));color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:5px solid var(--ink);outline-offset:4px}
.screen{height:100%;box-sizing:border-box;padding-inline:clamp(16px,3vw,40px);padding-block:clamp(12px,2vh,24px);display:flex;flex-direction:column;gap:clamp(10px,2vh,20px)}

/* ---------- MENU ---------- */
.logo{font-family:var(--display);font-size:clamp(40px,7vw,88px);line-height:.95;margin:0;text-align:center;letter-spacing:.01em;
  color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-wrap:balance}
.tiles{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(12px,2vw,24px);align-content:center}
.tile{background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);
  padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .08s}
.tile:active{transform:translateY(8px);box-shadow:0 2px 0 var(--ink)}
.tile svg,.tile .emo{height:clamp(56px,11vh,120px);width:auto;max-width:100%}
.tile{padding:12px 10px 10px;gap:4px;min-width:0}
.tiles .tile b{font-size:clamp(18px,2.25vw,32px);line-height:1.05;white-space:nowrap}
.tile small{font-size:14px;line-height:1.2}
.tile svg,.tile .emo{height:clamp(46px,8.5vh,96px)}
.tiles .tile .emo{font-size:clamp(36px,6.4vh,76px);line-height:1.15;height:auto}
.logo{font-size:clamp(34px,5.6vw,72px)}
.lvl .kid svg{height:clamp(70px,10.5vh,110px)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile .emo{font-size:clamp(50px,9.5vh,104px);line-height:1}
.tile b{font-family:var(--display);font-size:clamp(28px,4vw,44px);font-weight:400}
.tile small{font-size:18px;font-weight:600;opacity:.75}
.tile.t1{background:#ffe7a8}.tile.t2{background:#ffd0cb}.tile.t3{background:#cdf3d2}.tile.t4{background:#e2d6ff}.tile.t12{background:#fff0b3}.tile.t11{background:#d6f5c8}.tile.t10{background:#ffd0e8}.tile.t9{background:#ffd9b8}.tile.t8{background:#c8f0e6}.tile.t7{background:#d9dee8}.tile.t5{background:#cfe9ff}.tile.t6{background:#ffe0c2}
.menubar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.chip{font-weight:700;font-size:20px;padding:10px 20px;border-radius:999px;border:4px solid var(--ink);background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.menubar{align-items:flex-end}
.lvl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 22px 4px;background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,background .15s}
.lvl .kid svg{display:block;height:clamp(84px,13vh,120px);width:auto}
.lvl small{font-weight:700;font-size:15px;opacity:.7}
.lvl[aria-pressed="true"]{background:var(--sun);box-shadow:0 0 0 5px var(--go),0 6px 0 var(--ink)}
.lvl[aria-pressed="false"] .kid{opacity:.55}
.lvl:active{transform:translateY(5px)}
#fs,#voice{font-size:28px;padding:8px 16px;align-self:center}
.vname{align-self:center;font-weight:700;font-size:15px;max-width:220px;opacity:.8}
.label{font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.08em}

/* ---------- PLAY ---------- */
.topbar{display:flex;align-items:center;gap:14px}
.round-btn{width:64px;height:64px;flex:none;border-radius:50%;border:4px solid var(--ink);background:var(--paper);display:grid;place-items:center;position:relative;touch-action:none}
.round-btn svg{width:32px;height:32px}
.lock .ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--stop) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.track{flex:1;height:52px;border-radius:14px;background:var(--asphalt);border:4px solid var(--ink);position:relative;overflow:hidden;min-width:0}
.track::before{content:"";position:absolute;left:0;right:48px;top:50%;border-top:4px dashed var(--lane);transform:translateY(-50%)}
.flag{position:absolute;right:0;top:0;bottom:0;width:40px;background:
  conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/20px 20px}
.racer{position:absolute;top:50%;width:64px;left:calc((100% - 110px) * var(--pct,0) + 4px);transform:translateY(-50%);transition:left .9s cubic-bezier(.3,1.4,.5,1)}
.prompt{background:var(--paper);border:5px solid var(--ink);border-radius:24px;padding:12px 20px;text-align:center;
  font-family:var(--display);font-size:clamp(30px,5.2vw,64px);line-height:1.05;text-wrap:balance}
.cword{display:inline-block;padding:0 .3em;border-radius:.3em;border:4px solid var(--ink);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.stage{flex:1;min-height:0;background:var(--asphalt);border:5px solid var(--ink);border-radius:28px;position:relative;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(10px,2vw,28px);padding:clamp(10px,2vh,24px);overflow:hidden}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:14%;border-top:6px dashed var(--lane);opacity:.55;pointer-events:none}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:48%;position:relative;z-index:1}
.stage.solo .group{max-width:100%}
.truck{width:clamp(70px,11vw,140px)}
.plus{font-family:var(--display);font-size:clamp(60px,9vw,120px);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;z-index:1}
.answers{display:flex;gap:clamp(12px,2.5vw,32px);justify-content:center;flex-wrap:wrap}
.num{min-width:clamp(96px,16vw,170px);font-family:var(--display);font-size:clamp(56px,9vw,110px);line-height:1;padding:10px 18px 16px;
  background:var(--sun);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);transition:transform .08s}
.num:nth-child(2){background:#7fe0a0}.num:nth-child(3){background:#ffa6d2}
.num:active,.pick:active{transform:translateY(8px);box-shadow:0 2px 0 var(--ink)}
.pick{background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:clamp(8px,1.6vh,18px);
  width:clamp(130px,20vw,230px);aspect-ratio:1.25;max-width:44%;display:grid;place-items:center;position:relative;z-index:1;transition:transform .08s}
.pick svg{width:100%;height:100%;overflow:visible}
.pick.shape{aspect-ratio:1}
.dino{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,12vw,150px);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}

.stage.scene{padding:0;background:#e6f6ff}
.stage.scene::after{display:none}
.stage.scene>svg{width:100%;height:100%;display:block;overflow:visible}
.stage.scene>svg.draw{touch-action:none;cursor:crosshair}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:.2em .8em}
.step{white-space:nowrap;transition:opacity .3s}
.step.done{opacity:.35;text-decoration:line-through;text-decoration-thickness:.12em}
.keys{display:flex;gap:clamp(10px,2vw,22px);align-items:stretch;justify-content:center}
.keycap{font-family:var(--display);font-size:clamp(34px,5vw,56px);line-height:1;min-width:clamp(90px,12vw,130px);padding:12px 18px 16px;background:#f2f4f8;border:5px solid var(--ink);border-radius:18px;box-shadow:0 9px 0 var(--ink);touch-action:none;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .06s,box-shadow .06s,background .1s}
.keycap small{font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.keycap.space{min-width:clamp(220px,32vw,380px)}
.keycap.on{transform:translateY(7px);box-shadow:0 2px 0 var(--ink);background:var(--sun)}
.stage.typing{background:#fffaf0;flex-direction:column}
.stage.typing::after{display:none}
.typed{display:flex;flex-wrap:wrap;justify-content:center;gap:.18em;font-family:var(--display);font-size:clamp(48px,8vw,110px);line-height:1.1;color:var(--ink)}
.typed span{min-width:.72em;text-align:center;border-bottom:7px solid var(--ink)}
.typed span.cur{border-bottom-color:#2f6fe0;animation:blink 1s steps(1) infinite}
.typed-hint{font-weight:700;font-size:18px;opacity:.6}
@keyframes blink{50%{border-bottom-color:transparent}}
.kb{display:flex;flex-direction:column;gap:8px;align-items:center}
.kbrow{display:flex;gap:6px}
.kk{font-family:var(--display);font-size:clamp(20px,2.6vw,32px);min-width:clamp(32px,6.4vw,62px);height:clamp(40px,6.2vh,58px);padding:0 4px;border:3px solid var(--ink);border-radius:10px;background:#f2f4f8;box-shadow:0 4px 0 var(--ink);transition:transform .05s,box-shadow .05s,background .1s}
.kk.on,.kk:active{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.kk.go{background:var(--go);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;padding:0 26px;font-size:clamp(24px,3vw,38px)}
.typebtns{display:flex;gap:clamp(16px,3vw,40px);margin-top:clamp(10px,2vh,24px)}
.bigbtn{font-family:var(--display);font-size:clamp(34px,5vw,60px);line-height:1;padding:12px clamp(24px,4vw,52px) 16px;border:5px solid var(--ink);border-radius:24px;box-shadow:0 9px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.bigbtn.back{background:#f2f4f8;min-width:clamp(110px,14vw,170px)}
.bigbtn.go{background:var(--go);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;min-width:clamp(170px,22vw,260px)}
.bigbtn:active,.bigbtn.on{transform:translateY(7px);box-shadow:0 2px 0 var(--ink)}
.lt{display:inline-block;padding:0 .04em}.lt.now{color:#2f6fe0;text-decoration:underline;text-decoration-thickness:.1em}.lt.ok{color:#2fa84f}
.mapcv{width:100%;height:100%;display:block;touch-action:none;border-radius:22px;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:flex-end}
.tool{font-size:clamp(20px,2.4vw,30px);line-height:1;padding:5px 2px 4px;min-width:clamp(44px,4.9vw,62px);background:#f2f4f8;border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .06s,box-shadow .06s,background .1s}
.tool small{font-family:var(--body);font-size:10.5px;font-weight:700;white-space:nowrap}
.tool.on{background:var(--sun);transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tool.act{background:#cfe9ff}.tool.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.toolgap{width:6px}
.stage.drum{background:#262a35;padding:clamp(8px,1.4vh,14px);display:block;overflow:hidden}
.stage.drum::after{display:none}
.dgrid{display:grid;gap:clamp(4px,.6vw,8px);height:100%}
.dhead{display:flex;align-items:center;gap:4px;min-width:0}
.dpad{flex:1;height:100%;min-width:0;border:4px solid #141820;border-radius:14px;background:var(--c);font-size:clamp(24px,3.4vw,42px);line-height:1;display:grid;place-items:center;box-shadow:0 5px 0 #141820;transition:transform .05s,box-shadow .05s,filter .1s;touch-action:manipulation}
.dpad.hit,.dpad:active{transform:translateY(4px);box-shadow:0 1px 0 #141820;filter:brightness(1.25)}
.dswap{height:100%;width:clamp(26px,2.6vw,34px);border:3px solid #141820;border-radius:10px;background:#f2f4f8;font-size:clamp(13px,1.4vw,18px);padding:0}
.dcell{border:3px solid #141820;border-radius:10px;background:#3a4050;position:relative;display:grid;place-items:center;font-size:clamp(14px,2vw,26px);color:#fff;transition:background .08s;touch-action:manipulation;min-width:0}
.dcell.grp{background:#4a5266}
.dcell.on{background:var(--c)}
.dcell.acc{background:var(--c);box-shadow:inset 0 0 0 4px #fff,0 0 12px var(--c)}
.dcell.roll{background:var(--c);background-image:repeating-linear-gradient(90deg,transparent 0 40%,rgba(255,255,255,.55) 40% 60%)}
.dcell.now{outline:4px solid #ffd23f;outline-offset:-1px;filter:brightness(1.15)}
.dcell.hit{animation:dhit .2s ease-out}
@keyframes dhit{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.tool.play{background:var(--go);color:#fff;min-width:clamp(64px,7vw,90px)}
.tool.rec.on{background:#e5352b;color:#fff}
.tool.bpm{background:#fffaf0;cursor:default;min-width:clamp(50px,5vw,64px)}
.pal{display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vw,16px);justify-content:center}
.psw{width:clamp(54px,6.4vw,78px);height:clamp(54px,6.4vw,78px);border-radius:50%;border:5px solid var(--ink);background:var(--c);font-family:var(--display);font-size:clamp(26px,3.2vw,40px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink);position:relative;transition:transform .08s}
.psw.on{transform:translateY(-6px) scale(1.12);box-shadow:0 0 0 5px var(--sun),0 10px 0 var(--ink)}
.psw.done::after{content:'✓';position:absolute;right:-8px;top:-10px;font-size:24px;background:var(--go);color:#fff;-webkit-text-stroke:0;border:3px solid var(--ink);border-radius:50%;width:30px;height:30px;line-height:24px}
.psw.shake{animation:shake .45s}
.num.mission{display:flex;flex-direction:column;align-items:center;gap:4px}
.num .ic{display:flex;flex-wrap:wrap;justify-content:center;max-width:6.5em;font-size:clamp(14px,2vw,22px);line-height:1.1;letter-spacing:-.1em}
.blk{display:inline-block;width:.75em;height:.75em;margin:1px;background:#aab3c5;border:2px solid var(--ink);border-radius:2px}
.shake{animation:shake .45s}
.zoom svg{animation:zoom 1.4s cubic-bezier(.5,0,.9,.6) forwards}
.hop{animation:hop .7s ease-in-out 3}
.boom{position:absolute;z-index:3;font-size:clamp(90px,16vw,200px);left:50%;top:45%;transform:translate(-50%,-50%);animation:boom 1.2s ease-out forwards;pointer-events:none}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14px) rotate(-3deg)}40%{transform:translateX(12px) rotate(3deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes zoom{0%{transform:none}15%{transform:translateX(-12%) rotate(-4deg)}100%{transform:translateX(160vw)}}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-28px) rotate(-10deg)}70%{transform:translateY(4px) rotate(6deg)}}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}

/* ---------- WIN ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,34,48,.72);display:grid;place-items:center;z-index:10;padding:16px}
.card{background:var(--paper);border:6px solid var(--ink);border-radius:32px;padding:24px 28px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:560px}
.card .trophy{font-size:clamp(90px,18vh,170px);line-height:1;animation:hop .8s ease-in-out infinite}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,6vw,64px);margin:0;line-height:1}
.card .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{font-family:var(--display);font-size:32px;padding:12px 26px;border:5px solid var(--ink);border-radius:22px;background:var(--go);color:#fff;box-shadow:0 8px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.big.alt{background:var(--sun);color:var(--ink);-webkit-text-stroke:0}
.confetti{position:fixed;top:-20px;width:14px;height:22px;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<!-- MENU -->
<section class="screen" id="menu">
  <h1 class="logo">Truck &amp; Dino School</h1>
  <div class="tiles">
    <button class="tile t1" data-mode="count" id="t-count"><span id="ic-truck"></span><b>Numbers</b><small>Jump, crash &amp; boost</small></button>
    <button class="tile t2" data-mode="color" id="t-color"><span id="ic-car"></span><b>Colors</b><small>Draw a road to the colors</small></button>
    <button class="tile t3" data-mode="shape" id="t-shape"><span class="emo">🏈</span><b>Shapes</b><small>Throw through the shapes</small></button>
    <button class="tile t5" data-mode="trace" id="t-trace"><span class="emo">✏️</span><b>Trace</b><small>Dinos, cars &amp; animals</small></button>
    <button class="tile t6" data-mode="run" id="t-run"><span class="emo">🦖</span><b>Dino Jump</b><small>Jump with the space bar</small></button>
    <button class="tile t7" data-mode="park" id="t-park"><span id="ic-park"></span><b>Parking Lot</b><small>Slide cars, free the red car</small></button>
    <button class="tile t8" data-mode="map" id="t-map"><span class="emo">🏝️</span><b>Map Maker</b><small>Mountains, water &amp; volcanoes</small></button>
    <button class="tile t9" data-mode="blocks" id="t-blocks"><span class="emo">🧱</span><b>Blocks</b><small>Stack it, don't let it fall</small></button>
    <button class="tile t10" data-mode="beats" id="t-beats"><span class="emo">🥁</span><b>Beats</b><small>Make your own drum beat</small></button>
    <button class="tile t11" data-mode="brick" id="t-brick"><span class="emo">🏐</span><b>Brick Smash</b><small>Bounce the ball, break the wall</small></button>
    <button class="tile t12" data-mode="paint" id="t-paint"><span class="emo">🎨</span><b>Paint</b><small>Paint by number</small></button>
    <button class="tile t4" data-mode="mix" id="t-mix"><span class="emo">💥</span><b>Mix It Up</b><small>A little of everything</small></button>
  </div>
  <div class="menubar">
    <button class="lvl" id="lv-little" aria-pressed="true" aria-label="Little kid level"><span class="kid" id="kid-little"></span><small>Little</small></button>
    <button class="lvl" id="lv-big" aria-pressed="false" aria-label="Big kid level"><span class="kid" id="kid-big"></span><small>Big</small></button>
    <button class="chip" id="fs" aria-label="Full screen">⛶</button>
    <button class="chip" id="voice" aria-label="Change voice">🗣️</button><span id="vname" class="vname"></span>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play" hidden>
  <div class="topbar">
    <button class="round-btn lock" id="lock" aria-label="Grown-ups: hold to go home"><span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <div class="track"><div class="flag"></div><div class="racer" id="racer"></div></div>
    <button class="round-btn" id="again" aria-label="Say it again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
  <div class="prompt" id="prompt">Ready?</div>
  <div class="stage" id="stage"></div>
  <div class="answers" id="answers"></div>
</section>

<div class="overlay" id="win" hidden>
  <div class="card">
    <div class="trophy">🏆</div>
    <h2>You won the race!</h2>
    <div class="row"><button class="big" id="raceAgain" aria-label="Play again">🔁 Again</button><button class="big alt" id="goHome" aria-label="Home">🏠 Home</button></div>
  </div>
</div>

<script>
(()=>{
const GOAL=5;
const COLORS={red:'#e5352b',blue:'#2f6fe0',green:'#2fa84f',yellow:'#ffcc1f',orange:'#ff8a1f',purple:'#8a4fd8',pink:'#ff6fb5',black:'#2a2a2a',brown:'#8b5a2b'};
const TRUCK_COLORS=['red','blue','green','yellow','orange','purple','pink'];
const SHAPES_LITTLE=['circle','square','triangle','star','heart'];
const SHAPES_BIG=[...SHAPES_LITTLE,'rectangle','oval','diamond'];
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);

const state={mode:'count',level:'little',score:0,busy:false,say:''};

/* ---------- art ---------- */
function carSVG(c){return `<svg viewBox="0 0 130 72"><path d="M8 50 L18 32 Q24 20 38 20 L74 20 Q84 20 94 32 L110 36 Q124 39 124 50 L124 56 L8 56 Z" fill="${c}" stroke="#141820" stroke-width="4" stroke-linejoin="round"/>
<path d="M40 25 h16 v12 h-24 z M62 25 h14 q6 0 10 12 h-24z" fill="#cfeaff" stroke="#141820" stroke-width="3" stroke-linejoin="round"/>
<text x="92" y="50" font-family="Lilita One,Arial" font-size="14" fill="#fff" stroke="#141820" stroke-width="3" paint-order="stroke">7</text>
<circle cx="34" cy="57" r="11" fill="#1b1b1b"/><circle cx="34" cy="57" r="4.5" fill="#c9ced8"/><circle cx="100" cy="57" r="11" fill="#1b1b1b"/><circle cx="100" cy="57" r="4.5" fill="#c9ced8"/></svg>`}
function truckSVG(c){return `<svg viewBox="0 0 124 100" class="truck">${truckInner(c)}</svg>`}
function truckInner(c){const w=x=>`<circle cx="${x}" cy="76" r="22" fill="#1b1b1b"/><circle cx="${x}" cy="76" r="18" fill="none" stroke="#3b3b3b" stroke-width="7" stroke-dasharray="5 5"/><circle cx="${x}" cy="76" r="7" fill="#c9ced8" stroke="#141820" stroke-width="2"/>`;
return `<rect x="30" y="50" width="64" height="8" fill="#6b7280" stroke="#141820" stroke-width="3"/>${w(30)}${w(94)}
<path d="M10 30 Q10 24 16 24 L40 24 L50 8 L82 8 L92 24 L110 24 Q116 24 116 30 L116 50 L10 50 Z" fill="${c}" stroke="#141820" stroke-width="4" stroke-linejoin="round"/>
<path d="M53 13 h13 v11 h-19z M70 13 h10 l6 11 h-16z" fill="#cfeaff" stroke="#141820" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M20 38 l10 -6 l6 10 l10 -8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`}
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
function shapeSVG(s,c){return `<svg viewBox="0 0 100 100">${shapeInner(s,`fill="${c}" stroke="#141820" stroke-width="5" stroke-linejoin="round"`)}</svg>`}
function shapeInner(s,a){const m={
 circle:`<circle cx="50" cy="50" r="42" ${a}/>`,square:`<rect x="10" y="10" width="80" height="80" rx="3" ${a}/>`,
 triangle:`<polygon points="50,8 94,90 6,90" ${a}/>`,star:`<polygon points="${starPts(50,54,46,19)}" ${a}/>`,
 heart:`<path d="M50 90 C 12 62, 2 34, 24 17 C 38 7, 50 18, 50 28 C 50 18, 62 7, 76 17 C 98 34, 88 62, 50 90Z" ${a}/>`,
 rectangle:`<rect x="3" y="24" width="94" height="52" rx="3" ${a}/>`,oval:`<ellipse cx="50" cy="50" rx="47" ry="30" ${a}/>`,
 diamond:`<polygon points="50,3 90,50 50,97 10,50" ${a}/>`};
 return m[s]}
$('ic-truck').innerHTML=truckSVG(COLORS.orange);$('ic-car').innerHTML=carSVG(COLORS.red);
$('racer').innerHTML=carSVG(COLORS.red);

/* ---------- sound ---------- */
let ac;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac}
function noise(dur){const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;return s}
function env(g,t,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function crash(){if(!audio())return;const t=ac.currentTime;const n=noise(0.9),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(200,t+0.8);env(g,t,0.8,0.85);n.connect(f).connect(g).connect(ac.destination);n.start(t);
 for(let i=0;i<6;i++){const o=ac.createOscillator(),og=ac.createGain(),tt=t+0.05+i*0.07;o.type='square';o.frequency.value=rand(600,2400);env(og,tt,0.08,0.12);o.connect(og).connect(ac.destination);o.start(tt);o.stop(tt+0.15)}}
function vroom(){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(320,t+0.9);f.type='lowpass';f.frequency.value=900;env(g,t,0.35,1.1);o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+1.2)}
function roar(){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(60,t+1.1);l.frequency.value=22;lg.gain.value=25;l.connect(lg).connect(o.frequency);f.type='lowpass';f.frequency.value=700;env(g,t,0.5,1.2);o.connect(f).connect(g).connect(ac.destination);
 const n=noise(1.1),nf=ac.createBiquadFilter(),ng=ac.createGain();nf.type='bandpass';nf.frequency.value=400;env(ng,t,0.25,1.1);n.connect(nf).connect(ng).connect(ac.destination);o.start(t);l.start(t);n.start(t);o.stop(t+1.3);l.stop(t+1.3)}
function boop(){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(190,t+0.3);env(g,t,0.25,0.35);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.4)}
function ding(f=880){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);env(g,t,0.3,0.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.3)}
/* Voice: pick the most natural-sounding English voice this computer has */
let VOICES=[],VOICE=null;
function voiceScore(v){const n=v.name;let sc=0;
  if(/natural/i.test(n))sc+=100;if(/online/i.test(n))sc+=40;if(/google/i.test(n))sc+=60;
  if(/aria|jenny|ava|emma|ana\b|michelle|samantha|serena|libby|sonia/i.test(n))sc+=25;
  if(/en-US/i.test(v.lang))sc+=10;if(/zira/i.test(n))sc+=5;if(/david|mark|hazel|george/i.test(n)&&!/natural/i.test(n))sc-=5;return sc}
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  let saved='';try{saved=localStorage.getItem('tds-voice')||''}catch(e){}VOICE=VOICES.find(v=>v.name===saved)||VOICES[0]||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(text,delay=0){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const go=()=>{const u=new SpeechSynthesisUtterance(text);if(VOICE)u.voice=VOICE;
  const natural=VOICE&&/natural|online|google/i.test(VOICE.name);u.rate=natural?1:0.92;u.pitch=natural?1.05:1;s.speak(u)};delay?setTimeout(go,delay):go()}catch(e){}}

/* ---------- screens ---------- */
function show(id){$('menu').hidden=id!=='menu';$('play').hidden=id!=='play';}
function setPrompt(html,speech){$('prompt').innerHTML=html;state.say=speech;speak(speech,250)}
function updateTrack(){$('racer').style.setProperty('--pct',Math.min(state.score/GOAL,1))}
function start(mode){audio();state.mode=mode;state.score=0;updateTrack();show('play');newRound()}
function newRound(){state.busy=false;state.fb=null;state.typer=null;state.mapCtx=null;state.drum=null;state.brk=null;state.paintCtx=null;$('stage').style.background='';document.querySelector('.track').style.visibility='';const stage=$('stage'),ans=$('answers');stage.innerHTML='';stage.className='stage';ans.innerHTML='';
  const m=state.mode==='mix'?pick(['count','color','shape']):state.mode;
  if(state.mode==='count'){roundMission();return}
  if(state.mode==='color'){roundDrive();return}
  if(state.mode==='shape'){roundFootball();return}
  if(state.mode==='park'){roundParking();return}
  if(state.mode==='map'){roundMap();return}
  if(state.mode==='blocks'){roundBlocks();return}
  if(state.mode==='beats'){roundBeats();return}
  if(state.mode==='brick'){roundBrick();return}
  if(state.mode==='paint'){roundPaint();return}
  if(state.mode==='trace'){state.level==='big'?roundTraceType():roundTrace();return}
  if(state.mode==='run'){roundRun();return}
  ({count:roundCount,color:roundColor,shape:roundShape})[m]()}
function scoreWin(delay=2300){state.score++;updateTrack();setTimeout(()=>state.score>=GOAL?finish():newRound(),delay)}
function win(fn){state.busy=true;fn();scoreWin()}
function miss(el,line){if(state.busy)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');boop();speak(line,150)}
function boom(){const b=document.createElement('div');b.className='boom';b.textContent='💥';$('stage').appendChild(b)}
function options(ans,lo,hi){const s=new Set([ans]);while(s.size<3){const v=ans+pick([-2,-1,1,2]);if(v>=lo&&v<=hi)s.add(v)}return shuffle([...s])}
const cword=n=>`<span class="cword" style="background:${COLORS[n]}">${n}</span>`;

function roundCount(){
  const stage=$('stage'),big=state.level==='big';const grp=(n,c)=>`<div class="group">${Array.from({length:n},()=>truckSVG(COLORS[c])).join('')}</div>`;
  let ans;
  if(!big){ans=rand(1,5);stage.classList.add('solo');stage.innerHTML=grp(ans,pick(TRUCK_COLORS));setPrompt('How many monster trucks?','How many monster trucks?')}
  else{const a=rand(1,5),b=rand(1,4),[c1,c2]=sample(TRUCK_COLORS,2);ans=a+b;stage.innerHTML=grp(a,c1)+'<div class="plus">+</div>'+grp(b,c2);setPrompt(`${a} + ${b} = ?`,`${a} trucks plus ${b} trucks. How many trucks in all?`)}
  options(ans,1,big?9:6).forEach(v=>{const b=document.createElement('button');b.className='num';b.textContent=v;
    b.onclick=()=>{if(state.busy)return;if(v===ans)win(()=>{crash();boom();stage.querySelectorAll('.truck').forEach((t,i)=>{t.style.animationDelay=(i*60)+'ms';t.classList.add('hop')});
      const count=Array.from({length:ans},(_,i)=>i+1).join(', ');speak(`Crash! Yes! ${count}. ${ans} trucks!`,500)});
      else miss(b,`Hmm, not ${v}. Let's count again!`)};$('answers').appendChild(b)})
}
function roundColor(){
  const big=state.level==='big',names=sample(Object.keys(COLORS),big?4:3),target=pick(names);
  setPrompt(`Tap the ${cword(target)} car!`,`Tap the ${target} car!`);
  names.forEach(n=>{const b=document.createElement('button');b.className='pick';b.setAttribute('aria-label',n+' car');b.innerHTML=carSVG(COLORS[n]);
    b.onclick=()=>{if(state.busy)return;if(n===target)win(()=>{vroom();b.classList.add('zoom');speak(`Vroom! That's ${target}!`,300)});
      else miss(b,`That car is ${n}. Find ${target}!`)};$('stage').appendChild(b)})
}
function roundShape(){
  const big=state.level==='big',shapes=sample(big?SHAPES_BIG:SHAPES_LITTLE,big?4:3),target=pick(shapes),cols=sample(['red','blue','green','yellow','orange','purple','pink'],shapes.length);
  const art=s=>s==='oval'||s==='circle'?'an':'a';
  setPrompt(`Find the ${target}!`,`Find the ${target}!`);
  shapes.forEach((s,i)=>{const b=document.createElement('button');b.className='pick shape';b.setAttribute('aria-label',s);b.innerHTML=shapeSVG(s,COLORS[cols[i]]);
    b.onclick=()=>{if(state.busy)return;if(s===target)win(()=>{roar();b.querySelector('svg').style.opacity='.25';const d=document.createElement('div');d.className='dino';d.textContent=pick(['🦖','🦕']);b.appendChild(d);speak(`Roar! You found the ${target}!`,700)});
      else miss(b,`That's ${art(s)} ${s}. Find the ${target}!`)};$('stage').appendChild(b)})
}
/* ---------- NUMBERS MISSIONS (jump the gap, stop the runaway, boost) ---------- */
const NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tween=(ms,fn)=>new Promise(r=>{const t0=performance.now();const f=n=>{const t=Math.min((n-t0)/ms,1);fn(t);t<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)});
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const bolts=n=>'⚡'.repeat(n), blks=n=>'<i class="blk"></i>'.repeat(n);
function scene(){const st=$('stage');st.className='stage scene';
  st.innerHTML=`<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient></defs><rect x="-800" y="-400" width="2400" height="1200" fill="url(#skyg)"/><g class="bg"></g><g class="actors"></g><g class="fx"></g></svg>`;
  const svg=st.querySelector('svg');return{svg,bg:svg.querySelector('.bg'),actors:svg.querySelector('.actors'),fx:svg.querySelector('.fx')}}
const addBg=(sc,m)=>sc.bg.insertAdjacentHTML('beforeend',m);
function ground(sc,x,w,G){addBg(sc,`<rect x="${x}" y="${G}" width="${w}" height="${800-G}" fill="#9b6a3f"/><rect x="${x}" y="${G}" width="${w}" height="12" fill="#5cb85c" stroke="#141820" stroke-width="3"/>`)}
function svgText(size){const t=document.createElementNS(NS,'text');t.setAttribute('font-family','Lilita One,Arial');t.setAttribute('font-size',size);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.setAttribute('stroke','#141820');t.setAttribute('stroke-width','7');t.setAttribute('paint-order','stroke');return t}
function makeTruck(sc,color,mass=0,s=1,flip=false){const g=document.createElementNS(NS,'g');let blocks='';
  for(let i=0;i<mass;i++){const c=i%3,r=Math.floor(i/3);blocks+=`<rect x="${32+c*18}" y="${5-(r+1)*17}" width="16" height="16" rx="2" fill="#aab3c5" stroke="#141820" stroke-width="2.5"/>`}
  g.innerHTML=blocks+`<svg width="110" height="89" viewBox="0 0 124 100" overflow="visible">${truckInner(color)}</svg>`;
  const label=svgText(38);sc.actors.appendChild(g);sc.actors.appendChild(label);
  return{g,label,s,flip,top:Math.ceil(mass/3)*17,x:0,y:0,r:0}}
function dropTruck(a){a.g.remove();a.label.remove()}
function put(a,x,y,r=0){a.x=x;a.y=y;a.r=r;const s=a.s;
  a.g.setAttribute('transform',`translate(${x} ${y}) rotate(${r} ${55*s} ${45*s}) `+(a.flip?`translate(${110*s} 0) scale(${-s} ${s})`:`scale(${s})`));
  a.label.setAttribute('x',x+55*s);a.label.setAttribute('y',y-8-a.top*s)}
function fxPop(sc,emoji,x,y,size=100){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.textContent=emoji;sc.fx.appendChild(t);
  tween(1200,p=>{t.setAttribute('font-size',size*(0.4+p));t.setAttribute('opacity',1-p*p)}).then(()=>t.remove())}
function missionButtons(vals,icon,onPick){vals.forEach(v=>{const b=document.createElement('button');b.className='num mission';b.innerHTML=`${v}<span class="ic">${icon(v)}</span>`;b.setAttribute('aria-label',String(v));
  b.onclick=()=>{if(!state.busy)onPick(v,b)};$('answers').appendChild(b)})}
function roundMission(){const k=pick(['jump','stop','boost'].filter(x=>x!==state.last));state.last=k;({jump:missionJump,stop:missionStop,boost:missionBoost})[k]()}

function buildGap(sc,N,unit,R){const G=290,gapW=N*unit,L=800-R-gapW;ground(sc,-800,L+800,G);ground(sc,L+gapW,R+800,G);
  addBg(sc,`<rect x="${L}" y="${G}" width="${gapW}" height="${800-G}" fill="#5a3a22"/><rect x="${L}" y="365" width="${gapW}" height="435" fill="#7a4b2a"/>
  <polygon points="${L-70},${G} ${L},${G-26} ${L},${G}" fill="#ffd23f" stroke="#141820" stroke-width="3" stroke-linejoin="round"/>
  <line x1="786" y1="${G}" x2="786" y2="${G-95}" stroke="#141820" stroke-width="5"/><rect x="750" y="${G-95}" width="36" height="24" fill="#fff" stroke="#141820" stroke-width="3"/><rect x="750" y="${G-95}" width="18" height="12" fill="#141820"/><rect x="768" y="${G-83}" width="18" height="12" fill="#141820"/>`);
  for(let i=0;i<N;i++)addBg(sc,`<rect x="${L+i*unit+3}" y="${G+8}" width="${unit-6}" height="${unit-6}" rx="6" fill="#ffd23f" stroke="#141820" stroke-width="3"/><text x="${L+i*unit+unit/2}" y="${G+5+unit/2+unit*0.2}" font-size="${Math.round(unit*0.6)}" font-family="Lilita One,Arial" text-anchor="middle" fill="#141820">${i+1}</text>`);
  return{G,L,gapW}}
async function jumpOver(hero,{G,L,gapW},ok,frac=1){const x0=L-110,land=ok?L+gapW+8:x0+frac*(gapW+118),h=ok?140:50+60*frac;
  await tween(ok?950:800,t=>put(hero,x0+(land-x0)*t,G-87-h*4*t*(1-t),-14+(ok?14:30)*t));
  if(ok){await tween(280,t=>put(hero,land,G-87-16*Math.sin(Math.PI*t),0));return}
  await tween(450,t=>put(hero,land+20*t,G-87+(375-G)*t*t,16+14*t))}

function missionJump(){const big=state.level==='big',N=big?rand(3,7):rand(2,4),sc=scene(),geo=buildGap(sc,N,50,150);
  const hero=makeTruck(sc,COLORS.orange);put(hero,20,geo.G-87);
  setPrompt(`Jump the gap of ${N}!`,`The gap is ${N}. To jump it, the truck needs one more than ${N}. Which speed?`);
  missionButtons(shuffle([N-1,N,N+1]),bolts,async v=>{state.busy=true;hero.label.textContent='⚡'+v;vroom();
    await tween(900,t=>put(hero,20+(geo.L-130)*ease(t),geo.G-87));
    if(v===N+1){await jumpOver(hero,geo,true);crash();fxPop(sc,'🎉',hero.x+55,geo.G-150);speak(`Yes! ${v} is one more than ${N}. You made it!`,300);scoreWin(2800)}
    else{await jumpOver(hero,geo,false,v/(N+1));boop();fxPop(sc,'💦',hero.x+60,340,120);speak(`Splash! ${v} is not fast enough. The gap is ${N}. We need one more!`,200);
      await sleep(2800);hero.label.textContent='';put(hero,20,geo.G-87);state.busy=false}})}

function missionStop(){const big=state.level==='big',R=big?rand(3,7):rand(3,4),sc=scene(),G=320,HX=300,HT=140;
  const hillY=x=>x<HX?HT+(G-HT)*x/HX:G,ang=Math.atan2(G-HT,HX)*180/Math.PI;
  addBg(sc,`<polygon points="-800,${HT} 0,${HT} ${HX},${G} 1600,${G} 1600,800 -800,800" fill="#9b6a3f"/><polyline points="-800,${HT} 0,${HT} ${HX},${G} 1600,${G}" fill="none" stroke="#5cb85c" stroke-width="12"/><polyline points="-800,${HT-6} 0,${HT-6} ${HX},${G-6} 1600,${G-6}" fill="none" stroke="#141820" stroke-width="3"/>`);
  const run=makeTruck(sc,COLORS.purple,R,0.75+0.05*R);run.label.textContent=R;
  const placeRun=x=>{const cx=x+55*run.s,tilt=Math.max(0,Math.min(1,(HX-cx)/40));put(run,x,hillY(cx)-87*run.s,ang*tilt)};placeRun(0);
  const idle=()=>{const h=makeTruck(sc,COLORS.orange,0,0.75,true);h.label.textContent='?';put(h,690,G-87*0.75);return h};let hero=idle();
  setPrompt(`Stop the runaway truck!`,`Uh oh! A runaway truck with ${R} is rolling down the hill. To stop it, we need one more than ${R}. Which truck?`);
  missionButtons(shuffle([R-2,R-1,R+1]),blks,async m=>{state.busy=true;dropTruck(hero);
    hero=makeTruck(sc,COLORS.orange,m,0.75+0.05*m,true);hero.label.textContent=m;const hx0=790-110*hero.s;put(hero,hx0,G-87*hero.s);ding(500+m*60);
    await sleep(600);const runEnd=330,meet=runEnd+110*run.s;vroom();
    await tween(1100,t=>{placeRun(runEnd*t*t);put(hero,hx0+(meet-hx0)*t,G-87*hero.s)});
    crash();fxPop(sc,'💥',meet,G-60,130);
    if(m===R+1){await tween(300,t=>placeRun(runEnd-30*Math.sin(Math.PI*t/2)));speak(`Crash! ${m} is one more than ${R}. You stopped it!`,300);scoreWin(2800)}
    else{boop();await tween(900,t=>{const d=320*ease(t);placeRun(runEnd+d);put(hero,meet+d,G-87*hero.s,-25*Math.sin(Math.PI*t))});
      speak(`Whoa! ${m} is too light. The runaway has ${R}. We need one more!`,100);await sleep(2800);dropTruck(hero);hero=idle();placeRun(0);state.busy=false}})}

      while(st.length){const k=st.pop();r.cells.push(k);const x=k%W,y=k/W|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(id[j]<0&&grid[j]===grid[k]){id[j]=regs.length;st.push(j)}}}regs.push(r)}return{id,regs}};
  const minS=big?2:3;for(let it=0;it<20;it++){const {id,regs}=lab();let ch=false;
    for(const r of regs){if(r.cells.length>=minS)continue;const cnt={};for(const k of r.cells){const x=k%W,y=k/W|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(grid[j]!==r.c)cnt[grid[j]]=(cnt[grid[j]]||0)+1}}
      const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(best){r.cells.forEach(k=>grid[k]=best);ch=true}}if(!ch)break}
  const {id,regs}=lab();const area={};for(const c of grid)area[c]=(area[c]||0)+1;const cols=Object.keys(area).sort((a,b)=>area[b]-area[a]);
  regs.forEach(r=>{r.num=cols.indexOf(r.c)+1;r.filled=false;const set=new Set(r.cells),d=new Map();let fr=[];
    for(const k of r.cells){const x=k%W,y=k/W|0;if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx<0||ny<0||nx>=W||ny>=H||!set.has(ny*W+nx)})){d.set(k,0);fr.push(k)}}
    let lv=0;while(fr.length){lv++;const nf=[];for(const k of fr){const x=k%W,y=k/W|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const j=(y+dy)*W+(x+dx);if(set.has(j)&&!d.has(j)){d.set(j,lv);nf.push(j)}}}fr=nf}
    const mx=r.cells.reduce((t,k)=>t+k%W,0)/r.cells.length,my=r.cells.reduce((t,k)=>t+(k/W|0),0)/r.cells.length,cd=k=>(k%W-mx)**2+((k/W|0)-my)**2;
    let best=r.cells[0];for(const k of r.cells)if(d.get(k)>d.get(best)||(d.get(k)===d.get(best)&&cd(k)<cd(best)))best=k;r.lab=best});
  return{W,H,grid,id,regs,cols}}
function roundPaint(){const big=state.level==='big',pic=pick(PICS.filter(p=>p.n!==state.lastPaint));state.lastPaint=pic.n;
  const P=paintRaster(pic,big),{W,H,id,regs,cols}=P;let sel=1,done=false;const say=t=>speak(t);
  const st=$('stage');st.className='stage scene';st.innerHTML='<canvas class="mapcv" aria-label="Picture to paint" style="cursor:pointer"></canvas>';st.style.background='#fffaf0';
  const cv=st.querySelector('canvas'),g=cv.getContext('2d');let cs=1,ox=0,oy=0,pulse=0;
  function draw(){const dpr=Math.min(2,window.devicePixelRatio||1),cw=Math.max(1,st.clientWidth*dpr|0),ch=Math.max(1,st.clientHeight*dpr|0);if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
    g.setTransform(1,0,0,1,0,0);g.fillStyle='#fffaf0';g.fillRect(0,0,cw,ch);cs=Math.floor(Math.min((cw-16*dpr)/W,(ch-16*dpr)/H));ox=(cw-cs*W)/2|0;oy=(ch-cs*H)/2|0;
    for(const r of regs){const hex=PCOL[r.c][0];let f='#ffffff';if(r.filled||done)f=hex;g.fillStyle=f;for(const k of r.cells)g.fillRect(ox+(k%W)*cs,oy+(k/W|0)*cs,cs+.5,cs+.5);
      if(!r.filled&&!done&&r.num===sel){g.globalAlpha=(big?.22:.32)+.12*Math.sin(pulse*4);g.fillStyle=hex;for(const k of r.cells)g.fillRect(ox+(k%W)*cs,oy+(k/W|0)*cs,cs,cs);g.globalAlpha=1}}
    if(!done){g.strokeStyle='#3a3f4b';g.lineWidth=Math.max(1.5,cs*.07);g.beginPath();
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(x+1<W&&id[i]!==id[i+1]){g.moveTo(ox+(x+1)*cs,oy+y*cs);g.lineTo(ox+(x+1)*cs,oy+(y+1)*cs)}if(y+1<H&&id[i]!==id[i+W]){g.moveTo(ox+x*cs,oy+(y+1)*cs);g.lineTo(ox+(x+1)*cs,oy+(y+1)*cs)}}
      g.stroke();g.lineWidth=Math.max(2,cs*.09);g.strokeRect(ox,oy,cs*W,cs*H);
      g.textAlign='center';g.textBaseline='middle';g.font=`bold ${Math.round(cs*.62)}px Fredoka, Arial, sans-serif`;
      for(const r of regs){if(r.filled)continue;const x=ox+(r.lab%W+.5)*cs,y=oy+((r.lab/W|0)+.5)*cs;g.fillStyle=r.num===sel?'#141820':'#5b6273';g.fillText(r.num,x,y+1)}}
    else{g.lineWidth=Math.max(3,cs*.12);g.strokeStyle='#141820';g.strokeRect(ox,oy,cs*W,cs*H)}}
  let raf=0;const loop=()=>{if(state.paintCtx!==me||$('play').hidden)return;pulse+=1/60;draw();raf=requestAnimationFrame(loop)};const me={};state.paintCtx=me;
  const regAt=e=>{const r=cv.getBoundingClientRect(),dpr=cv.width/r.width,x=Math.floor(((e.clientX-r.left)*dpr-ox)/cs),y=Math.floor(((e.clientY-r.top)*dpr-oy)/cs);if(x<0||y<0||x>=W||y>=H)return null;return regs[id[y*W+x]]};
  let lastWrong=0,down=false;
  function paintAt(e,tap){if(done)return;const r=regAt(e);if(!r||r.filled)return;
    if(r.num!==sel){if(tap&&performance.now()-lastWrong>900){lastWrong=performance.now();boop();say(`That one is number ${r.num}!`);const b=document.querySelector(`.psw[data-n="${r.num}"]`);if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}return}
    r.filled=true;ding(500+sel*60+Math.random()*80);
    if(!regs.some(q=>q.num===sel&&!q.filled)){const b=document.querySelector(`.psw[data-n="${sel}"]`);b&&b.classList.add('done');
      if(regs.every(q=>q.filled)){done=true;vroom();setTimeout(crash,300);say(`You painted a ${pic.n}! Beautiful!`);scoreWin(3400);return}
      const nx=cols.findIndex((c,i)=>regs.some(q=>q.num===i+1&&!q.filled))+1;const was=sel;say(`All the ${PCOL[cols[sel-1]][1]} is done!`);setTimeout(()=>{if(sel===was&&!done)choose(nx,true)},900)}}
  cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}paintAt(e,true)});
  cv.addEventListener('pointermove',e=>{if(down)paintAt(e,false)});['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>down=false));
  function choose(n,quiet){sel=n;document.querySelectorAll('.psw').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));if(!quiet||true)say(`Number ${n}, ${PCOL[cols[n-1]][1]}!`)}
  $('answers').innerHTML=`<div class="pal">${cols.map((c,i)=>`<button class="psw" data-n="${i+1}" style="--c:${PCOL[c][0]}" aria-label="Number ${i+1}, ${PCOL[c][1]}">${i+1}</button>`).join('')}</div>`;
  document.querySelectorAll('.psw').forEach(b=>b.addEventListener('click',()=>{audio();ding(700);choose(+b.dataset.n)}));
  document.querySelectorAll('.psw').forEach(b=>b.classList.toggle('on',+b.dataset.n===sel));
  const intro=!state.paintIntro;state.paintIntro=true;
  setPrompt(`Paint the ${pic.n}!`,(intro?'Pick a color, then tap the spaces with the same number! ':'')+`Paint the ${pic.n}! Start with number 1, ${PCOL[cols[0]][1]}.`);
  raf=requestAnimationFrame(loop)}

function finish(){crash();setTimeout(vroom,400);$('win').hidden=false;speak('You won the race! Great job!',600);
  const cs=Object.values(COLORS);for(let i=0;i<60;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cs);c.style.animationDuration=(1.8+Math.random()*2)+'s';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}}

  const i=(VOICES.indexOf(VOICE)+1)%VOICES.length;VOICE=VOICES[i];try{localStorage.setItem('tds-voice',VOICE.name)}catch(e){}
  $('vname').textContent=`${VOICE.name.replace(/^Microsoft |^Google /,'').replace(/ - .*$/,'')} (${i+1}/${VOICES.length})`;speak("Hi! Let's play a game!")};
$('raceAgain').onclick=()=>{$('win').hidden=true;state.score=0;updateTrack();newRound()};

let hold,raf,t0;const lock=$('lock'),ring=lock.querySelector('.ring');
const stopHold=()=>{clearTimeout(hold);cancelAnimationFrame(raf);ring.style.setProperty('--p',0)};
lock.addEventListener('pointerdown',e=>{e.preventDefault();t0=performance.now();const tick=()=>{ring.style.setProperty('--p',Math.min((performance.now()-t0)/2000,1));raf=requestAnimationFrame(tick)};tick();
  hold=setTimeout(()=>{stopHold();try{speechSynthesis.cancel()}catch(e){};show('menu')},2000)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>lock.addEventListener(ev,stopHold));
lock.onclick=e=>e.preventDefault();

})();
